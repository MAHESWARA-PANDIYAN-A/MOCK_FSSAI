services:
  - type: web
    name: mock-fssai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        value: sqlite:///./fssai_mock.db
      - key: JWT_SECRET
        generateValue: true
      - key: MOCK_FSSAI_API_KEY
        value: fssai-mock-secret-key-2026
      - key: FRONTEND_URL
        value: https://localhost:5173
